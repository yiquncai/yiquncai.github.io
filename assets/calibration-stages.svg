<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img"><rect width="1040" height="570" rx="18" fill="#f5f7f4"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#416c67"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203e3d}.title{font-size:26px;font-weight:bold}.sub{font-size:17px;fill:#60746e}.label{font-size:19px}.small{font-size:16px}</style><text class="title" x="40" y="48">Calibration connects readings to a reference</text><text class="sub" x="40" y="80">Per-channel coefficients · board first, then sensor + leads + board</text><text class="label" x="40" y="130">01 · Board-level resistance calibration</text><rect x="40" y="155" width="240" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="160.0" y="187">Resistance points</text><text class="small" text-anchor="middle" x="160.0" y="213">Precision resistance box</text><rect x="360" y="155" width="275" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="497.5" y="187">Paired readings</text><text class="small" text-anchor="middle" x="497.5" y="213">Board + high-precision DMM</text><rect x="715" y="155" width="285" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="857.5" y="187">Excel fit</text><text class="small" text-anchor="middle" x="857.5" y="213">a · Rraw² + b · Rraw + c</text><path d="M280 200H358" fill="none" stroke="#416c67" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 200H713" fill="none" stroke="#416c67" stroke-width="2.5" marker-end="url(#a)"/><text class="label" x="40" y="310">02 · Full-chain temperature calibration</text><rect x="40" y="335" width="240" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="160.0" y="367">Temperature chamber</text><text class="small" text-anchor="middle" x="160.0" y="393">Test + reference sensors</text><rect x="360" y="335" width="275" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="497.5" y="367">Compare stable readings</text><text class="small" text-anchor="middle" x="497.5" y="393">Matched sampling rate</text><rect x="715" y="335" width="285" height="90" rx="9" fill="white" stroke="#99b4a9"/><text class="label" text-anchor="middle" x="857.5" y="367">Channel correction</text><text class="small" text-anchor="middle" x="857.5" y="393">Inspect reference deviations</text><path d="M280 380H358" fill="none" stroke="#416c67" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 380H713" fill="none" stroke="#416c67" stroke-width="2.5" marker-end="url(#a)"/><text class="label" x="40" y="490">Repeatability ≠ reference agreement</text><text class="sub" x="40" y="525">~0.1 mK (1σ), fixed resistance · within ±1 mK of reference, tested full chain</text></svg>