<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#f6f4ef"/><style>text{font-family:Arial,sans-serif;fill:#263c46}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.note{font-size:18px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a45b43" stroke-width="1.5"/></marker></defs><text x="50" y="58" class="title">电桥采集板的噪声测试链</text><text x="50" y="91" class="small">Bridge acquisition board · Noise measurement</text><rect x="50" y="124" width="1100" height="100" rx="14" fill="#e8e2d8"/><text x="75" y="160" class="label">市电 / Mains (L · N · PE)</text><text x="75" y="197" class="small">① 供电传导干扰　② 引线辐射拾取　③ 仪器保护地形成的接地回路</text><g fill="white" stroke="#45646a" stroke-width="2"><rect x="50" y="300" width="310" height="170" rx="14"/><rect x="445" y="300" width="310" height="170" rx="14"/><rect x="840" y="300" width="310" height="170" rx="14"/></g><g class="label"><text x="75" y="342">电桥采集板</text><text x="470" y="342">SR560 低噪声前放</text><text x="865" y="342">示波器 / Scope</text></g><g class="small"><text x="75" y="382">Wheatstone bridge + AD8221</text><text x="75" y="419">板卡供电：台式电源 → 电池</text><text x="75" y="449">接地屏蔽 / Grounded shield</text><text x="470" y="382">交流耦合 · 低通滤波</text><text x="470" y="419">增益 ×100–1000</text><text x="470" y="449">电池模式 / Battery mode</text><text x="865" y="382">RMS 噪声读数</text><text x="865" y="419">FFT 频谱</text><text x="865" y="449">观察 50 Hz 干扰分量</text></g><g stroke="#a45b43" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M365 385H431"/><path d="M760 385H826"/><path d="M200 230V285" stroke-dasharray="7 6"/><path d="M600 230V285" stroke-dasharray="7 6"/><path d="M995 230V285" stroke-dasharray="7 6"/></g><text x="50" y="530" class="label">板卡输出端噪声 = 示波器 RMS 读数 ÷ 前放增益</text><text x="50" y="566" class="small">Board-output noise = scope RMS ÷ preamplifier gain</text><text x="50" y="618" class="small">逐项对照：板卡供电 → 屏蔽与引线 → 前放供电 → 接地方式</text><text x="50" y="653" class="note"></text></svg>